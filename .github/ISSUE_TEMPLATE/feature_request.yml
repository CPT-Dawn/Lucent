name: Feature request
description: Something Lucent should do
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: Lucent exits when idle on purpose, so a feature that needs it to stay running (history, do-not-disturb, a control centre) is out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The change you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What other daemons do
      description: How mako, dunst, swaync or fnott handle it, if you know.

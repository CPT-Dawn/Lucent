name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    # Arch ships current GTK 4 and gtk4-layer-shell, which Ubuntu lacks.
    container: archlinux:base-devel
    steps:
      - name: Install system packages
        run: pacman -Syu --noconfirm --needed git rust gtk4 gtk4-layer-shell

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  packaging:
    name: release packaging scripts
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install system packages
        run: pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Test packaging scripts
        # makepkg refuses to run as root.
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder bash packaging/test.sh

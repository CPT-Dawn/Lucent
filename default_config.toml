# Lucent reference configuration
#
# Copy what you want to change to ~/.config/lucent/config.toml
# ($XDG_CONFIG_HOME/lucent/config.toml). Every setting is optional: a key you
# leave out keeps the built-in default shown here, and no file at all is fine.
#
# Lucent reads this file when it starts and never writes it. It exits while
# idle, so changes apply from the next Notification. A broken file is logged
# to stderr (your user journal when D-Bus starts Lucent) and the defaults are
# used instead; unknown keys are logged and skipped.
#
# Print this file again with `lucent --default-config`.

[general]

# How long a Popup stays on screen, in milliseconds, unless the app asks for
# its own timeout (see `honor_app_timeouts`).
timeout = 5000

# The most Popups shown at once. Further Notifications wait their turn and
# appear as earlier ones close.
max_visible = 5

# Whether an app's requested timeout (including "never expire") replaces
# `timeout` above. Set it to false to use `timeout` for every app. Critical
# Notifications never expire either way.
honor_app_timeouts = true

# Body lines shown before the rest is cut with an ellipsis.
body_lines = 4


[layout]

# Where the Stack starts; new Popups appear here and older ones move away
# from this edge. One of:
#   "top-left"     "top-center"     "top-right"
#   "bottom-left"  "bottom-center"  "bottom-right"
anchor = "top-right"

# Popup width, in pixels.
width = 360

# Space between Popups, in pixels.
gap = 8

# The monitor to show Popups on, by output name (see `hyprctl monitors`,
# `swaymsg -t get_outputs` or `niri msg outputs`). Leave it unset to let the
# compositor choose, which is normally the focused monitor. A name that
# matches no monitor is logged and falls back to the compositor's choice.
# monitor = "eDP-1"

# Distance from the screen edges, in pixels. Only the edges the anchor
# touches matter: "top-right" uses top and right.
[layout.margin]
top = 16
right = 16
bottom = 16
left = 16

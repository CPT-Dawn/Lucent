# Lucent configuration
#
# Every option below is optional and shown with its default value,
# commented out. To change one, remove the `# ` in front of it (and in
# front of its [section] line) and edit the value. Lucent applies your
# changes as soon as you save; run `lucent check` to validate this file.
#
# Delete this file to get a fresh copy on the next start.

## Look and feel: "auto" uses Dawn in dark mode and Daybreak in light mode.
## Themes: auto, dawn, daybreak, graphite (follows light/dark too).
## For full control, put CSS in style.css next to this file: it is applied
## on top of the Theme and reloads when you save it.
# theme = "auto"

# [popup]
## Where Popups appear: top or bottom, then left, center or right.
# position = "top-right"
## Popup width in pixels.
# width = 380
## At most this many Popups at once; the rest wait behind a "+N more" pill.
# max_visible = 5
## Pixels between Popups, and between the stack and the screen edges.
# gap = 10
# margin = 16
## Monitor to show Popups on: "" means the focused one, or e.g. "DP-1".
# output = ""

# [timeout]
## Seconds a Popup stays, by Urgency; 0 means it stays until dismissed.
## An app that sets its own timeout wins for low and normal. Critical
## ignores it and uses `critical` (a Rule's timeout still wins over both).
# low = 3
# normal = 5
# critical = 0

# [look]
## Accent colour as hex, e.g. "#ff8a3d"; "" keeps the Theme's own
## orange-to-violet (or grey) gradient. It also colours the first Action.
# accent = ""
## Background opacity, from 0.0 (invisible) to 1.0. It scales the Theme's
## own translucency (Dawn's glass is 76% opaque, so 0.5 makes it 38%);
## text and borders stay crisp. Pair it with compositor blur.
# opacity = 1.0
## Corner radius in pixels.
# radius = 14
## Font family; "" uses your system UI font.
# font = ""
## Size of the app icon or image in pixels.
# icon_size = 40
## Show the line along the bottom of each Popup that counts down its time.
# countdown = true

# [history]
## How many Notifications History remembers (in memory only).
# limit = 100

# [dnd]
## Let Critical Notifications through while Do Not Disturb is on.
# allow_critical = true

## Per-app Rules tame noisy apps. There are none out of the box: the three
## below are recipes to copy. Each Rule starts with its own [[rule]] line.
## A Rule matches on `app` and/or `summary`, case-insensitively, where `*`
## stands for any text (no regex). Rules are checked in order and the first
## match wins. A Rule can then set:
##   timeout = 2           seconds this Popup stays (0 = until dismissed),
##                         even if the app asked for something else
##   urgency = "critical"  low, normal or critical
##   hide = true           no Popup, but it is still recorded in History
##   history = false       keep it out of History
## Rules run before Do Not Disturb, so a Rule that makes an app Critical
## lets it through.

## Spotify's track changes vanish after 2 seconds.
# [[rule]]
# app = "spotify"
# timeout = 2

## Discord's "is typing" never pops up (it still lands in History).
# [[rule]]
# app = "discord"
# summary = "*is typing*"
# hide = true

## Slack is Critical: it stays until dismissed and gets through Do Not
## Disturb.
# [[rule]]
# app = "slack"
# urgency = "critical"

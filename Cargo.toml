[package]
name = "lucent"
version = "1.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Swastik Patel"]
license = "MIT"
description = "A blazing-fast, visually stunning Wayland notification daemon"
repository = "https://github.com/CPT-Dawn/Lucent"
keywords = ["wayland", "notification", "daemon", "hyprland", "dbus"]
categories = ["gui", "system-tools"]

[dependencies]
# D-Bus server — tokio-native, no background async-io thread
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service", "tracing"] }

# Async runtime for the D-Bus thread; its channels also wake the GLib loop
tokio = { version = "1.54", features = ["rt", "sync", "macros"] }

# Streams of D-Bus signals for `lucent status --follow`
futures-util = { version = "0.3", default-features = false }

# UI framework
gtk4 = { version = "0.11", features = ["v4_22"] }

# Wayland layer-shell integration for overlay notification windows
gtk4-layer-shell = "0.8"

# Configuration
toml = "1.1"
directories = "6"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Command line: `lucent <subcommand>`
clap = { version = "4.6", features = ["derive"] }

# Typed control-interface replies, and JSON output for scripts
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

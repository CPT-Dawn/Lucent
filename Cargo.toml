[package]
name = "lucent"
version = "1.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Swastik Patel <dev@cptdawn.dev>"]
license = "MIT"
description = "The lightest notification daemon for Wayland"
repository = "https://github.com/CPT-Dawn/Lucent"
keywords = ["wayland", "notification", "daemon", "hyprland", "dbus"]
categories = ["gui", "command-line-utilities"]

[dependencies]
calloop = "0.14"
calloop-wayland-source = "0.4"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
dbus = "0.9"
cairo-rs = "0.22"
pango = "0.22"
pangocairo = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
